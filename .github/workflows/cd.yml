# ─────────────────────────────────────────────────────────────────────────────
#  CD Pipeline — Apio API Monitor
#
#  Triggers : push to main (auto) OR manual workflow_dispatch
#
#  Job graph:
#
#    ┌─────────────────────┐
#    │  build-and-publish  │  Build Docker image + push to GHCR
#    └──────────┬──────────┘
#               │
#    ┌──────────▼──────────┐
#    │  deploy-vps         │  SSH → docker compose pull + up (Redis + backend)
#    └──────────┬──────────┘
#               │
#    ┌──────────▼──────────┐
#    │  deploy-vercel      │  Trigger Vercel redeploy (web + auth)
#    └──────────┬──────────┘
#               │
#    ┌──────────▼──────────┐
#    │  smoke-test         │  Hit /health on the live VPS backend
#    └─────────────────────┘
#
# Required GitHub Secrets:
#   VPS_HOST               — VPS IP or domain (e.g. 123.456.789.0)
#   VPS_USER               — SSH user (e.g. ubuntu, root)
#   VPS_SSH_KEY            — contents of your private SSH key (~/.ssh/id_rsa)
#   VPS_PUBLIC_URL         — backend public URL (e.g. https://api.apio.one)
#   VERCEL_TOKEN           — Vercel personal access token
#   VERCEL_ORG_ID          — Vercel org/team ID
#   VERCEL_WEB_PROJECT_ID  — Vercel project ID for apps/web
#   VERCEL_AUTH_PROJECT_ID — Vercel project ID for apps/auth
#   VERCEL_WEB_URL         — public URL of web frontend (for smoke test)
# ─────────────────────────────────────────────────────────────────────────────

name: CD

on:
  push:
    branches: [main]

  # Manual trigger — useful for re-deploying without a code change
  workflow_dispatch:

# Only one production deployment at a time — never cancel in flight
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/apio-backend
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # ── 1. Build + Push Docker image to GHCR ─────────────────────────────────────
  build-and-publish:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-docker
          cache-to:   type=gha,scope=backend-docker,mode=max

      - name: Image digest summary
        run: |
          echo "### 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`latest\` | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY

  # ── 2. Deploy Backend — Cloud VPS (docker compose) ───────────────────────────
  # Redis container keeps running during deploys — only backend containers restart.
  # This means zero cache loss and no cold-start penalty on each deploy.
  deploy-vps:
    name: 🖥️ Deploy Backend (VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-publish]

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            echo "📦 Pulling latest backend image..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            echo "🔄 Restarting backend containers (Redis stays up)..."
            cd /opt/apio

            # Only restart backend containers — Redis is NOT restarted so the
            # cache (rate-limit counters, query cache, Socket.io state) is preserved.
            docker compose --env-file /etc/apio/.env up -d --no-deps \
              nestjs_1 nestjs_2 worker

            echo "✅ Deploy complete — container status:"
            docker compose --env-file /etc/apio/.env ps

      - name: Wait for backend to initialize
        run: sleep 20

      - name: Verify backend health
        run: |
          curl --fail --silent --show-error \
            --max-time 15 \
            --retry 5 \
            --retry-delay 10 \
            --retry-connrefused \
            "${{ secrets.VPS_PUBLIC_URL }}/health" | jq .

  # ── 3. Deploy Frontend — Vercel (web + auth) ──────────────────────────────────
  deploy-vercel:
    name: ▲ Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-publish]

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy web app to Vercel (production)
        run: |
          vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --prod \
            --yes \
            --cwd=apps/web
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

      - name: Deploy auth app to Vercel (production)
        run: |
          vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --prod \
            --yes \
            --cwd=apps/auth
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AUTH_PROJECT_ID }}

  # ── 4. Smoke Test — verify live endpoints after deploy ────────────────────────
  smoke-test:
    name: 🔥 Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-vps, deploy-vercel]

    steps:
      - name: Backend health check
        run: |
          echo "Testing: ${{ secrets.VPS_PUBLIC_URL }}/health"
          curl --fail --silent --show-error \
            --max-time 10 \
            "${{ secrets.VPS_PUBLIC_URL }}/health" | jq .

      - name: Frontend availability check
        run: |
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" "${{ secrets.VERCEL_WEB_URL }}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Frontend returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Frontend is up (HTTP $HTTP_CODE)"

      - name: Post deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | ${{ secrets.VPS_PUBLIC_URL }}  | ✅ Live |" >> $GITHUB_STEP_SUMMARY
          echo "| Web App  | ${{ secrets.VERCEL_WEB_URL }} | ✅ Live |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit   | ${{ github.sha }} | deployed |" >> $GITHUB_STEP_SUMMARY
