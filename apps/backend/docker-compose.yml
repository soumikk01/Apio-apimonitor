# ─────────────────────────────────────────────────────────────────────────────
#  docker-compose.yml — Apio Backend Stack
#
#  Services:
#   • redis       — Redis 7 (cache + BullMQ queue + Socket.io adapter)
#   • nestjs_1    — NestJS API instance 1
#   • nestjs_2    — NestJS API instance 2
#   • worker      — BullMQ job worker
#   • nginx       — Load balancer
#
#  Local dev (Redis only, backend via bun run dev):
#    docker compose up -d redis
#
#  VPS production (full stack):
#    docker compose --env-file /etc/apio/.env up -d
#
#  Redis data persists across restarts via the redis_data volume.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  # Self-hosted Redis on Docker — replaces Redis Cloud.
  # Password-protected, memory-limited with LRU eviction, AOF persistence.
  redis:
    image: redis:7-alpine
    container_name: apio-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-apio_redis_dev_secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
      --loglevel notice
    ports:
      - "127.0.0.1:6379:6379"   # only accessible from localhost — NOT exposed to internet
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-apio_redis_dev_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - api_monitor_net

  # ── NestJS API — Instance 1 ─────────────────────────────────────────────────
  nestjs_1:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-soumikk01}/apio-backend:latest
    container_name: api_monitor_nestjs_1
    depends_on:
      redis:
        condition: service_healthy   # wait for Redis before starting
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      # Point to the docker redis container — NOT Redis Cloud
      REDIS_URL: redis://:${REDIS_PASSWORD:-apio_redis_dev_secret}@apio-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-1h}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_EXPIRY: ${ADMIN_JWT_EXPIRY:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_URL: ${AUTH_URL}
      ADMIN_URL: ${ADMIN_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - api_monitor_net

  # ── NestJS API — Instance 2 ─────────────────────────────────────────────────
  nestjs_2:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-soumikk01}/apio-backend:latest
    container_name: api_monitor_nestjs_2
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4001:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD:-apio_redis_dev_secret}@apio-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-1h}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_EXPIRY: ${ADMIN_JWT_EXPIRY:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_URL: ${AUTH_URL}
      ADMIN_URL: ${ADMIN_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - api_monitor_net

  # ── BullMQ Worker ─────────────────────────────────────────────────────────────
  # Separate process — only processes queue jobs, no HTTP server.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ghcr.io/${GHCR_OWNER:-soumikk01}/apio-backend:latest
    container_name: api_monitor_worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD:-apio_redis_dev_secret}@apio-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_URL: ${AUTH_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
    restart: unless-stopped
    networks:
      - api_monitor_net

  # ── NGINX Load Balancer ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: api_monitor_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/api-monitor.conf:ro
      - ./nginx/certs:/etc/ssl:ro
    depends_on:
      nestjs_1:
        condition: service_healthy
      nestjs_2:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - api_monitor_net

# ── Volumes ────────────────────────────────────────────────────────────────────
# redis_data persists Redis data across container restarts and re-deploys.
volumes:
  redis_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────────
# All containers share one internal network — Redis is only reachable from within.
networks:
  api_monitor_net:
    driver: bridge
